name: gestor_asistencias
description: Gestor de Asistencias para Windows con SQLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  bcrypt: ^1.1.3
  crypto: ^3.0.6
  file_picker: ^8.3.7
  excel: ^4.0.6
  archive: any
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  camera: ^0.11.0+2
  camera_windows: ^0.2.6
  zxing2: ^0.2.3
  image: ^4.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/icon/
